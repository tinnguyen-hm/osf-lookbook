<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSF × Hike Medical — Email Series Review</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .doc-download { text-align:center; margin-bottom: 16px; }
  .doc-download a { display:inline-block; font-size:13px; font-weight:700; color:#fff; background:var(--osf-green); padding:8px 18px; border-radius:8px; text-decoration:none; }
  .doc-viewer-wrap { display:flex; justify-content:center; padding: 0 0 8px; }
  .doc-viewer-wrap img { width:100%; max-width:1000px; height:auto; box-shadow:0 10px 40px rgba(16,24,40,0.15); background:#fff; border-radius:4px; display:block; cursor: zoom-in; }
  .doc-hint { text-align:center; font-size:12px; color:var(--text-gray); margin: -8px 0 16px; }

  .lb-overlay { position:fixed; inset:0; background:rgba(10,14,26,0.92); z-index:1000; display:none; align-items:center; justify-content:center; overflow:auto; }
  .lb-overlay.open { display:flex; }
  .lb-overlay.open.zoomed { display:block; padding:40px; box-sizing:border-box; }
  .lb-overlay img { display:block; }
  .lb-overlay img.fit { max-width:92vw; max-height:92vh; width:auto; height:auto; cursor: zoom-in; margin:auto; }
  .lb-overlay img.full { max-width:none; max-height:none; width:auto; height:auto; cursor: zoom-out; margin:0; }
  .lb-close { position:fixed; top:18px; right:22px; z-index:1001; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.12); color:#fff; border:none; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .lb-close:hover { background:rgba(255,255,255,0.22); }
  .lb-hint { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:1001; color:#fff; font-size:12px; opacity:.75; }
</style>
</head>
<body>

<div class="subpage-bar"><a href="index.html">← Back to Lookbook</a></div>
<div class="subpage-title">
  <span class="num">08</span>
  <h2>OSF Email Series</h2>
  <span class="desc">Two-email sequence introducing the benefit and comparing Hike to alternatives</span>
</div>

<div class="subpage-content">
  <div class="doc-download"><a href="OSF%20FALL%20EMAILS.png" download>Download Image</a></div>
  <div class="doc-viewer-wrap">
    <img id="emailsImg" src="OSF%20FALL%20EMAILS.png" alt="OSF Email Series">
  </div>
  <div class="doc-hint">Click the image to zoom in for a closer look</div>

  <div id="comments-root" data-page="emails"></div>
</div>

<div class="lb-overlay" id="lbOverlay">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <img id="lbImg" class="fit" src="OSF%20FALL%20EMAILS.png" alt="OSF Email Series — zoomed">
  <div class="lb-hint">Click image to zoom in/out &middot; Esc or click outside to close</div>
</div>

<script src="js/comments-config.js"></script>
<script src="js/comments.js"></script>
<script src="js/nav.js"></script>
<script>
(function () {
  var thumb = document.getElementById('emailsImg');
  var overlay = document.getElementById('lbOverlay');
  var lbImg = document.getElementById('lbImg');
  var closeBtn = document.getElementById('lbClose');

  function openLightbox() {
    lbImg.className = 'fit';
    overlay.classList.remove('zoomed');
    overlay.classList.add('open');
  }
  function closeLightbox() {
    overlay.classList.remove('open');
    overlay.classList.remove('zoomed');
  }

  thumb.addEventListener('click', openLightbox);
  closeBtn.addEventListener('click', closeLightbox);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeLightbox();
  });
  lbImg.addEventListener('click', function () {
    var zoomingIn = lbImg.className === 'fit';
    lbImg.className = zoomingIn ? 'full' : 'fit';
    overlay.classList.toggle('zoomed', zoomingIn);
    if (zoomingIn) {
      // center the initial scroll position on where the user clicked
      requestAnimationFrame(function () {
        overlay.scrollLeft = (overlay.scrollWidth - overlay.clientWidth) / 2;
        overlay.scrollTop = (overlay.scrollHeight - overlay.clientHeight) / 2;
      });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeLightbox();
  });
})();
</script>
</body>
</html>
